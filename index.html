            'counter_pv_label': '總瀏覽', 'counter_uv_label': '今日瀏覽', 'counter_unit': '次',
        },
        en: {

            'col_group': 'Group', 'col_sector': 'Cluster', 'col_1d': '1D %', 'col_1w': '1W %', 'col_1m': '1M %', 'col_tickers': 'Tickers',

    };
    const SECTOR = {
        zh: {'Information Technology':'資訊科技','Communication Services':'通訊服務','Consumer Discretionary':'非必需消費','Consumer Staples':'必需消費','Health Care':'醫療保健','Financials':'金融','Energy':'能源','Industrials':'工業','Materials':'原材料','Utilities':'公用事業','Real Estate':'房地產','Conglomerates':'綜合企業'},
        en: {'Information Technology':'Information Technology','Communication Services':'Communication Services','Consumer Discretionary':'Consumer Discretionary','Consumer Staples':'Consumer Staples','Health Care':'Health Care','Financials':'Financials','Energy':'Energy','Industrials':'Industrials','Materials':'Materials','Utilities':'Utilities','Real Estate':'Real Estate','Conglomerates':'Conglomerates'},
    };
    const GROUP = {
        zh: {'Internet Platforms':'互聯網平台','Software SaaS':'軟件 SaaS','Hardware':'硬件','Semiconductors':'半導體','Gaming':'遊戲','Telecom Carriers':'電訊商','Casino':'賭場','Electric Vehicles':'電動車','E-commerce Retail':'電商零售','Restaurants':'餐飲','Consumer Durables HK':'消費耐久品','Apparel & Sportswear':'服飾及運動','Food & Beverage':'食品飲料','Pharmaceuticals':'製藥','Medical Devices':'醫療器械','Healthcare Services':'醫療服務','Mainland Banks':'內地銀行','International Banks':'國際銀行','Insurance':'保險','Brokerage & Exchange':'券商及交易所','Mainland Property':'內房','Property Management':'物業管理','Hong Kong Property':'香港房地產',"REITs & Rentals":'REITs 及收租','Shipping & Ports':'航運及港口','Airlines':'航空','Machinery':'機械','Oil & Gas':'石油天然氣','Gas Utilities':'燃氣','Coal':'煤炭','Metals & Mining':'金屬及採礦','Power Utilities':'電力','Water & Environment':'水務及環保','Conglomerates':'綜合企業'},
        en: {'Internet Platforms':'Internet Platforms','Software SaaS':'Software SaaS','Hardware':'Hardware','Semiconductors':'Semiconductors','Gaming':'Gaming','Telecom Carriers':'Telecom Carriers','Casino':'Casino','Electric Vehicles':'Electric Vehicles','E-commerce Retail':'E-commerce Retail','Restaurants':'Restaurants','Consumer Durables HK':'Consumer Durables (HK)','Apparel & Sportswear':'Apparel & Sportswear','Food & Beverage':'Food & Beverage','Pharmaceuticals':'Pharmaceuticals','Medical Devices':'Medical Devices','Healthcare Services':'Healthcare Services','Mainland Banks':'Mainland Banks','International Banks':'International Banks','Insurance':'Insurance','Brokerage & Exchange':'Brokerage & Exchange','Mainland Property':'Mainland Property','Property Management':'Property Management','Hong Kong Property':'Hong Kong Property',"REITs & Rentals":'REITs & Rentals','Shipping & Ports':'Shipping & Ports','Airlines':'Airlines','Machinery':'Machinery','Oil & Gas':'Oil & Gas','Gas Utilities':'Gas Utilities','Coal':'Coal','Metals & Mining':'Metals & Mining','Power Utilities':'Power Utilities','Water & Environment':'Water & Environment','Conglomerates':'Conglomerates'},

    function detectLang(dl) {

        if(s==='zh'||s==='en') return s;
        const b=(navigator.language||'zh').toLowerCase();
        if(b.startsWith('zh')) return 'zh'; if(b.startsWith('en')) return 'en';
        return dl||'zh';
    }
    function setLang(lang) {

    }
    window.EagleI18n={detect:detectLang,set:setLang,get:()=>currentLang,t,tGroup,tSector,apply:applyTranslations,UI,SECTOR,GROUP};

<script>
const COLORS = ['#00FF88','#FFD700','#FF6B9D','#00D4FF','#FF9500','#FF3333','#33FF57','#FF33F1','#3399FF','#FF6600','#CC33FF','#FFDD00','#00FFCC','#FF4466'];
const SECTOR_ORDER = ['Information Technology','Communication Services','Consumer Discretionary','Consumer Staples','Health Care','Financials','Energy','Industrials','Materials','Utilities','Real Estate'];

let allData = null;
let currentDays = 60;
let currentView = 'cumulative';

// Interactive state
let sortKey = 'group';
let sortAsc = true;
let sectorFilter = '';
let tickerFilter = '';
let activeGroup = null;  // Currently highlighted group (clicked row)

async function loadData() {
    try {
        // Primary: GitHub Pages; Fallback: raw GitHub (bypasses CDN cache)
        const r = await fetch('data.json?_t=' + Date.now());
        if (r.ok) return await r.json();
        throw new Error('Not OK');
    } catch(e) {
        try {
            const r = await fetch('https://raw.githubusercontent.com/echoland00/stock-dashboard-hk/main/data.json?_t=' + Date.now());
            return await r.json();
        } catch(e2) { return null; }
    }
}

function groupDailyReturns(dates, groupRets, days, view) {
    const sliced = {};
    const d = dates.slice(-days);
    for (const [name, rets] of Object.entries(groupRets)) {
        const vals = rets.slice(-days);
        if (view === 'cumulative') {
            let cum = 100;
            sliced[name] = vals.map(r => { cum *= (1 + r/100); return Math.round(cum*100)/100; });
        } else {
            sliced[name] = vals.map(r => Math.round(r*100)/100);
        }
    }
    return { dates: d, groups: sliced };
}

function getLastVal(groups, name) {
    const v = groups[name];
    return v ? v[v.length-1] : null;
}

// ====== Interactive table ======

function buildGroupRows() {
    const stocks = allData.stocks || {};
    const sectors = allData.sectors || {};
    const tickerLookup = allData.ticker_lookup || {};
    return Object.keys(stocks).map(grp => {
        const { change1d, change1w, change1m } = computeChanges(grp);
        return {
            group: grp,
            sector: sectors[grp] || '',
            count: (stocks[grp] || []).length,
            change1d, change1w, change1m,
            tickers: stocks[grp] || [],
            tickerLookup
        };
    });
}

// Compute 1D and 1W percentage change using full-period daily returns
// (1D = last 1 trading day, 1W = last 5 trading days) — independent of period selector
function computeChanges(grp) {
    const rets = (allData.groups || {})[grp];
    if (!rets || rets.length < 2) return { change1d: null, change1w: null, change1m: null };
    // Build cumulative series from daily returns (base 100)
    const cum = [];
    let v = 100;
    for (const r of rets) { v *= (1 + r / 100); cum.push(v); }
    const last = cum[cum.length - 1];
    const d1  = cum.length >= 2 ? cum[cum.length - 2] : last;
    const d5  = cum.length >= 6 ? cum[cum.length - 6] : cum[0];
    const d21 = cum.length >= 22 ? cum[cum.length - 22] : cum[0];  // ~1 month
    return {
        change1d: (last - d1) / d1 * 100,
        change1w: (last - d5) / d5 * 100,
        change1m: (last - d21) / d21 * 100
    };
}

function applyFilters(rows) {
    const tf = tickerFilter.trim().toUpperCase();
    const tickerLookup = allData.ticker_lookup || {};
    return rows.filter(r => {
        if (sectorFilter && r.sector !== sectorFilter) return false;
        if (tf) {
            // First check if ticker is in this group's tickers list
            const inGroup = r.tickers.some(t => t.toUpperCase().includes(tf));
            // Fallback: check if ticker_lookup maps to THIS group
            const directGroup = tickerLookup[tf];
            if (!inGroup && directGroup !== r.group) return false;
        }
        return true;
    });
}

function applySort(rows) {
    const dir = sortAsc ? 1 : -1;
    const sorted = [...rows];
    sorted.sort((a, b) => {
        let av, bv;
        switch (sortKey) {
            case 'group':    av = a.group.toLowerCase();  bv = b.group.toLowerCase();  break;
            case 'sector':   av = a.sector.toLowerCase(); bv = b.sector.toLowerCase(); break;
            case 'change1d': av = a.change1d ?? -Infinity; bv = b.change1d ?? -Infinity; break;
            case 'change1w': av = a.change1w ?? -Infinity; bv = b.change1w ?? -Infinity; break;
            case 'change1m': av = a.change1m ?? -Infinity; bv = b.change1m ?? -Infinity; break;
            case 'tickers':  av = a.tickers.join(',');    bv = b.tickers.join(',');    break;
            default: return 0;
        }
        if (av < bv) return -1 * dir;
        if (av > bv) return  1 * dir;
        return 0;
    });
    return sorted;
}

function renderStockTable() {
    const tb = document.getElementById('stockTableBody');
    tb.innerHTML = '';
    const rows = applySort(applyFilters(buildGroupRows()));
    const meta = document.getElementById('tableMeta');
    meta.textContent = `${EagleI18n.t('table_meta_prefix')} ${rows.length} / ${Object.keys(allData.stocks || {}).length} ${EagleI18n.t('table_meta_suffix')}`;

    // Sort indicators
    ['group','sector','change1d','change1w','change1m','tickers'].forEach(k => {
        const th = document.getElementById('th-' + k);
        if (!th) return;
        const ind = th.querySelector('.sort-ind');
        if (ind) ind.textContent = (sortKey === k) ? (sortAsc ? '▲' : '▼') : '';
    });

    if (!rows.length) {
        const tr = document.createElement('tr');
        tr.className = 'empty-row';
        tr.innerHTML = `<td colspan="6">${EagleI18n.t('empty_msg')}</td>`;
        tb.appendChild(tr);
        return;
    }

    const fmtPct = v => v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
    const clsPct = v => v == null ? 'flat' : (v > 0.005 ? 'up' : v < -0.005 ? 'down' : 'flat');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    for (const r of rows) {
        const tr = document.createElement('tr');
        tr.dataset.group = r.group;
        if (r.group === activeGroup) tr.classList.add('active');
        tr.innerHTML = `
            <td>${esc(EagleI18n.tGroup(r.group))}</td>
            <td class="cluster" title="${esc(EagleI18n.tSector(r.sector))}">${esc(EagleI18n.tSector(r.sector))}</td>
            <td class="numeric change ${clsPct(r.change1d)}">${fmtPct(r.change1d)}</td>
            <td class="numeric change ${clsPct(r.change1w)}">${fmtPct(r.change1w)}</td>
            <td class="numeric change ${clsPct(r.change1m)}">${fmtPct(r.change1m)}</td>
            <td class="tickers">${esc(r.tickers.join(', '))}</td>
        `;
        tr.onclick = () => setActiveGroup(r.group);
        tb.appendChild(tr);
    }
}

function populateSectorFilter() {
    const sel = document.getElementById('sectorFilter');
    // Keep first "All Sectors" option
    sel.innerHTML = `<option value="" data-i18n="filter_all_sectors">${EagleI18n.t('filter_all_sectors')}</option>`;
    const sectorsInData = Array.from(new Set(Object.values(allData.sectors || {})));
    const ordered = SECTOR_ORDER.filter(s => sectorsInData.includes(s));
    for (const s of ordered) {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = EagleI18n.tSector(s);
        sel.appendChild(opt);
    }
    sel.value = sectorFilter;
}

function setActiveGroup(groupName) {
    if (activeGroup === groupName) {
        // Click same row again → clear highlight
        activeGroup = null;
    } else {
        activeGroup = groupName;
    }
    updateChartHighlights();
    renderStockTable();
}

function updateChartHighlights() {
    // Highlight the card whose sector contains activeGroup; dim other cards.
    // Also dim the inactive group traces within the highlighted card.
    const sectors = allData.sectors || {};
    const activeSector = activeGroup ? sectors[activeGroup] : null;
    document.querySelectorAll('.plot-card').forEach(card => {
        const cardSector = card.dataset.sector;
        if (!activeGroup) {
            card.classList.remove('highlighted', 'dimmed');
        } else if (cardSector === activeSector) {
            card.classList.add('highlighted');
            card.classList.remove('dimmed');
        } else {
            card.classList.add('dimmed');
            card.classList.remove('highlighted');
        }
    });
    // Dim legend items not matching activeGroup
    document.querySelectorAll('.color-legend .item').forEach(item => {
        const g = item.dataset.group;
        if (!activeGroup) item.classList.remove('muted');
        else if (g === activeGroup) item.classList.remove('muted');
        else item.classList.add('muted');
    });
}

function resetAll() {
    sortKey = 'group';
    sortAsc = true;
    sectorFilter = '';
    tickerFilter = '';
    activeGroup = null;
    document.getElementById('sectorFilter').value = '';
    document.getElementById('tickerSearch').value = '';
    updateChartHighlights();
    renderStockTable();
}

function render() {
    if (!allData) return;
    const { dates, groups: grpRets } = allData;
    const { dates: slicedDates, groups: slicedGroups } = groupDailyReturns(dates, grpRets, currentDays, currentView);
    const sectors = allData.sectors || {};

    // Summary
    let best = { n: '', v: -Infinity }, worst = { n: '', v: Infinity };
    for (const [n, v] of Object.entries(slicedGroups)) {
        const last = v[v.length-1];
        if (last > best.v) best = { n, v: last };
        if (last < worst.v) worst = { n, v: last };
    }
    const allVals = Object.values(slicedGroups).map(v => v[v.length-1]);
    const avg = allVals.reduce((a,b)=>a+b,0) / allVals.length;
    document.getElementById('summaryContainer').innerHTML = `
        <div class="summary-item"><div class="label">${EagleI18n.t('label_best')}</div><div class="val up">${EagleI18n.tGroup(best.n)}</div><div class="label">${currentView === 'cumulative' ? best.v.toFixed(1) : '+' + best.v.toFixed(2) + '%'}</div></div>
        <div class="summary-item"><div class="label">${EagleI18n.t('label_worst')}</div><div class="val down">${EagleI18n.tGroup(worst.n)}</div><div class="label">${currentView === 'cumulative' ? worst.v.toFixed(1) : worst.v.toFixed(2) + '%'}</div></div>
        <div class="summary-item"><div class="label">${EagleI18n.t('label_avg')}</div><div class="val" style="color:#fff">${avg.toFixed(1)}</div><div class="label">${Object.keys(slicedGroups).length} ${EagleI18n.t('groups_unit')}</div></div>
    `;
    document.getElementById('updateDate').textContent = `${EagleI18n.t('updated_prefix')}: ${slicedDates[slicedDates.length-1]} ${EagleI18n.t('updated_sep')} generated ${allData.generated_at}`;

    // Stock count meta
    const stockCount = Object.values(allData.stocks || {}).reduce((s, arr) => s + arr.length, 0);
    const idxCount = Object.keys(allData.indices || {}).length;
    document.getElementById('stockCountMeta').textContent = `${stockCount} ${EagleI18n.t('stocks_count')} · ${idxCount} ${EagleI18n.t('indices_count')}`;

    // HK indices summary (HSI / HSCE / HSTECH) — 1D/1W/1M
    const indices = allData.indices || {};
    const idxCum = {};  // ticker -> cumulative value series
    for (const [ticker, info] of Object.entries(indices)) {
        const rets = info.returns.slice(-currentDays);
        let cum = 100;
        idxCum[ticker] = rets.map(r => { cum *= (1 + r/100); return Math.round(cum*100)/100; });
    }
    // Compute 1D / 1W / 1M change per index (independent of period selector, from full series)
    const fmtPct = v => v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
    const clsPct = v => v == null ? 'flat' : (v > 0.005 ? 'up' : v < -0.005 ? 'down' : 'flat');
    // Index ticker → i18n key map (since data.json stores English names, we re-translate)
    const idxKey = {'^HSI': 'index_hsi', '^HSCE': 'index_hsce', '3032.HK': 'index_hstech'};
    const indicesHtml = Object.entries(indices).map(([ticker, info]) => {
        const rets = info.returns;
        if (!rets || rets.length < 2) return '';
        // Build cum from full series
        let cum = 100;
        const cumSeries = rets.map(r => { cum *= (1 + r/100); return cum; });
        const last = cumSeries[cumSeries.length-1];
        const d1  = cumSeries.length >= 2 ? cumSeries[cumSeries.length-2] : last;
        const d5  = cumSeries.length >= 6 ? cumSeries[cumSeries.length-6] : cumSeries[0];
        const d21 = cumSeries.length >= 22 ? cumSeries[cumSeries.length-22] : cumSeries[0];
        const c1 = (last - d1) / d1 * 100;
        const c5 = (last - d5) / d5 * 100;
        const cM = (last - d21) / d21 * 100;
        const lastVal = idxCum[ticker] ? idxCum[ticker][idxCum[ticker].length-1] : null;
        const label = (idxKey[ticker] && EagleI18n.t(idxKey[ticker])) || info.name;
        return `
            <div class="summary-item" style="min-width:140px;border-left:3px solid #6c5ce7;">
                <div class="label">${label}</div>
                <div class="val" style="color:#fff;font-size:13px;">${lastVal != null ? lastVal.toFixed(1) : '—'}</div>
                <div style="display:flex;gap:8px;justify-content:center;margin-top:4px;font-size:10px;">
                    <span class="${clsPct(c1)}">${fmtPct(c1)}</span>
                    <span style="color:#555;">${EagleI18n.t('period_1d')}</span>
                    <span class="${clsPct(c5)}">${fmtPct(c5)}</span>
                    <span style="color:#555;">${EagleI18n.t('period_1w')}</span>
                    <span class="${clsPct(cM)}">${fmtPct(cM)}</span>
                    <span style="color:#555;">${EagleI18n.t('period_1m')}</span>
                </div>
            </div>
        `;
    }).join('');
    const idxContainer = document.getElementById('indicesContainer');
    if (idxContainer) idxContainer.innerHTML = indicesHtml;

    // Subplots by sector
    const grid = document.getElementById('chartGrid');
    grid.innerHTML = '';

    for (const sector of SECTOR_ORDER) {
        const groupsInSector = Object.entries(sectors).filter(([,s]) => s === sector).map(([g]) => g);
        const validGroups = groupsInSector.filter(g => slicedGroups[g]);
        if (!validGroups.length) continue;

        const card = document.createElement('div');
        card.className = 'plot-card';
        card.dataset.sector = sector;
        const titleDiv = document.createElement('div');
        titleDiv.className = 'title';
        const lastVals = validGroups.map(g => `${EagleI18n.tGroup(g)} ${getLastVal(slicedGroups, g).toFixed(1)}`).join(' | ');
        titleDiv.innerHTML = `<span>${EagleI18n.tSector(sector)}</span><span class="range">${lastVals}</span>`;
        card.appendChild(titleDiv);

        // Color legend strip (also clickable → highlight group)
        const legendDiv = document.createElement('div');
        legendDiv.className = 'color-legend';
        validGroups.forEach((g, i) => {
            const item = document.createElement('span');
            item.className = 'item';
            item.dataset.group = g;
            item.innerHTML = '<span class="dot" style="background:' + COLORS[i % COLORS.length] + '"></span>' + EagleI18n.tGroup(g);
            item.onclick = (e) => { e.stopPropagation(); setActiveGroup(g); };
            legendDiv.appendChild(item);
        });
        card.appendChild(legendDiv);

        const plotDiv = document.createElement('div');
        plotDiv.className = 'plot';
        plotDiv.id = `p-${sector.replace(/[^a-z]/gi,'')}`;
        card.appendChild(plotDiv);
        grid.appendChild(card);

        const traces = validGroups.map((g, i) => ({
            x: slicedDates, y: slicedGroups[g], type: 'scatter', mode: 'lines', name: EagleI18n.tGroup(g),
            line: { color: COLORS[i % COLORS.length], width: 2.5 },
            hovertemplate: `<b>${EagleI18n.tGroup(g)}</b><br>%{x|%m/%d}<br>${currentView==='cumulative'?'%{y:.1f}':'%{y:.2f}%'}<extra></extra>`
        }));
        const layout = {
            paper_bgcolor: '#151530', plot_bgcolor: '#151530',
            margin: { l: 30, r: 8, t: 4, b: 24 }, showlegend: false,
            xaxis: { gridcolor: '#2a2a3e', tickfont: {color:'#666',size:8}, zeroline: false },
            yaxis: { gridcolor: '#2a2a3e', tickfont: {color:'#666',size:8}, zeroline: currentView==='daily', zerolinecolor: '#444' },
            hovermode: 'closest', dragmode: false,
            hoverlabel: { bgcolor: '#1a1a3e', font: {color: '#fff', size: 11}, bordercolor: '#2a2a4e' },
        };
        Plotly.newPlot(plotDiv.id, traces, layout, { responsive: true, displayModeBar: false });
        
        // Click to highlight point
        const selectedPoints = {};
        plotDiv.on('plotly_click', data => {
            const pt = data.points[0];
            const plotId = plotDiv.id;
            // Remove previous highlight
            if (selectedPoints[plotId]) {
                Plotly.addTraces(plotId, { x: [selectedPoints[plotId].x], y: [selectedPoints[plotId].y], type: 'scatter', mode: 'markers', marker: { size: 14, color: '#fff', symbol: 'circle', opacity: 0 }, name: '_hl' }, 0);
                Plotly.deleteTraces(plotId, 1);
            }
            // Add new highlight
            selectedPoints[plotId] = { x: pt.x, y: pt.y };
            Plotly.addTraces(plotId, { x: [pt.x], y: [pt.y], type: 'scatter', mode: 'markers', marker: { size: 14, color: '#FFD700', symbol: 'circle', line: { width: 2, color: '#000' } }, name: '_hl' }, 0);
        });
    }

    // Re-apply highlight state (cards were just re-rendered)
    updateChartHighlights();

    // Stock table
    renderStockTable();
}

loadData().then(data => {
    if (data) { allData = data; populateSectorFilter(); render(); }
    else document.getElementById('chartGrid').innerHTML = '<div style="text-align:center;padding:40px;color:#888;">' + EagleI18n.t('failed_load') + '</div>';
});

        sel.addEventListener('change', e => {

            sortAsc = !DESC_FIRST.has(k);
        }

    };
});
